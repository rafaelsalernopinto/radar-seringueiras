name: Coletar produtores DDD 17

on:
  workflow_dispatch:
    inputs:
      modo_teste:
        description: "Teste rápido (só uma parte da base, não publica o painel)"
        type: boolean
        default: false
  schedule:
    - cron: "0 12 20 * *"   # todo dia 20, às 9h de Brasília

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas
        run: pip install requests openpyxl duckdb cryptography

      - name: Rodar coleta
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAINEL_SENHA: ${{ secrets.PAINEL_SENHA }}
          MODO_TESTE: ${{ inputs.modo_teste || 'false' }}
        run: python coletar.py

      - name: Preparar painel para publicar
        if: success() && inputs.modo_teste != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - name: Salvar histórico (para marcar quem é novo)
        if: success() && inputs.modo_teste != true
        run: |
          git config user.name "coleta-bot"
          git config user.email "coleta-bot@users.noreply.github.com"
          git add historico/cnpjs.txt
          git diff --cached --quiet || git commit -m "Atualiza histórico de CNPJs"
          git push

  publicar:
    needs: coletar
    if: inputs.modo_teste != true
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Publicar painel no GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
